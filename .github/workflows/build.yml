name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Installer scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check shell syntax and updater guards
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/update.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/serve.sh
          bash -n scripts/mcp-cdp.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/test-personal-setup.sh
          bash scripts/test-personal-setup.sh

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git \
            libclang-dev libssl-dev llvm-dev pkg-config python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: personal-build-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Repair incomplete V8 cache
        run: |
          set -euo pipefail
          if [[ ! -f target/release/gn_out/obj/librusty_v8.a || ! -s target/release/gn_out/obj/librusty_v8.a ]]; then
            rm -f -- target/release/gn_out/obj/librusty_v8.a target/release/gn_out/obj/librusty_v8.sum
            cargo clean --release -p v8 || true
          fi

      - name: Build release binaries
        run: cargo build --release -p obscura-cli --bins --features render

      - name: Smoke test
        run: |
          set -euo pipefail
          ./target/release/obscura --version
          ./target/release/obscura fetch "data:text/html,<title>ok</title>" --eval "1+1"
